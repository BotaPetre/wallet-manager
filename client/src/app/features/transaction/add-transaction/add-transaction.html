<div class="form-container">
    <nz-card nzTitle="Transaction">
        <form nz-form nzLayout="vertical" novalidate (submit)="submitNewTransaction($event)">
            <nz-form-item>
                <nz-form-label nzFor="tr-date">Date</nz-form-label>
                <nz-form-control>
                    <input nz-input id="tr-date" type="text" [formField]="trForm.createDate" />
                    <signal-form-error [field]="trForm.createDate" />
                </nz-form-control>
            </nz-form-item>

            <nz-form-item>
                <nz-form-label nzFor="tr-amount">Amount</nz-form-label>
                <nz-form-control>
                    <input nz-input id="tr-amount" type="number" [formField]="trForm.amount" />
                    <signal-form-error [field]="trForm.amount" />
                </nz-form-control>
            </nz-form-item>
            <nz-form-item>
                <nz-form-label nzFor="tr-category">Category</nz-form-label>
                <nz-form-control>
                    <input nz-input id="tr-category" type="text" [formField]="trForm.category" />
                    <signal-form-error [field]="trForm.category" />
                </nz-form-control>
            </nz-form-item>

            <nz-form-item>
                <nz-form-label nzFor="tr-note">Note</nz-form-label>
                <nz-form-control>
                    <input nz-input id="tr-note" type="text" [formField]="trForm.note" />
                </nz-form-control>
            </nz-form-item>

            <nz-form-item>
                <nz-form-control>
                    <button nz-button nzType="primary" nzSize="large" nzShape="round" nzBlock htmlType="submit">
                        Save
                    </button>
                </nz-form-control>
            </nz-form-item>
        </form>
    </nz-card>
</div>
